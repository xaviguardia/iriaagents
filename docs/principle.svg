<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220"
     font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">

  <!-- Background -->
  <rect width="840" height="220" rx="16" fill="#f1f5f9"/>

  <!-- ── LEFT CARD: INMUTABLE ── -->
  <rect x="20" y="20" width="375" height="180" rx="14" fill="#4f46e5"/>

  <!-- Bullseye / diana — concentric circles centered at (90,95) -->
  <circle cx="90" cy="95" r="32" fill="white" fill-opacity="0.95"/>
  <circle cx="90" cy="95" r="24" fill="#4f46e5"/>
  <circle cx="90" cy="95" r="16" fill="white"/>
  <circle cx="90" cy="95" r="8"  fill="#4f46e5"/>
  <circle cx="90" cy="95" r="3"  fill="white"/>

  <!-- Title -->
  <text x="145" y="82" fill="white" font-size="22" font-weight="700">Objetivo + Tests</text>

  <!-- Badge -->
  <rect x="145" y="93" width="225" height="22" rx="11" fill="white" fill-opacity="0.18"/>
  <text x="257" y="108" fill="white" font-size="10" font-weight="700"
        text-anchor="middle" letter-spacing="2">INMUTABLE · EL CONTRATO</text>

  <!-- Descriptions -->
  <text x="145" y="137" fill="white" font-size="13" fill-opacity="0.85">No se toca una vez acordado</text>
  <text x="145" y="158" fill="white" font-size="13" fill-opacity="0.85">Define qué significa "hecho"</text>

  <!-- Divider -->
  <line x1="145" y1="123" x2="380" y2="123" stroke="white" stroke-opacity="0.2" stroke-width="1"/>

  <!-- ── VS BUBBLE ── -->
  <circle cx="420" cy="110" r="24" fill="#1e293b"/>
  <text x="420" y="116" fill="white" font-size="14" font-weight="700" text-anchor="middle">vs</text>

  <!-- ── RIGHT CARD: MUTABLE ── -->
  <rect x="445" y="20" width="375" height="180" rx="14" fill="#d97706"/>

  <!-- Icon circle -->
  <circle cx="515" cy="95" r="34" fill="white" fill-opacity="0.15"/>
  <!-- Heroicons: arrow-path (outline, 24×24) — scaled ×2.5, centered at (515,95) -->
  <g transform="translate(485,65) scale(2.5)">
    <path fill="none" stroke="white" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"
          vector-effect="non-scaling-stroke"
      d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0
         3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1
         13.803-3.7l3.181 3.182m0-4.991v4.99"/>
  </g>

  <!-- Title -->
  <text x="570" y="82" fill="white" font-size="22" font-weight="700">Plan + Tareas</text>

  <!-- Badge -->
  <rect x="570" y="93" width="220" height="22" rx="11" fill="white" fill-opacity="0.18"/>
  <text x="680" y="108" fill="white" font-size="10" font-weight="700"
        text-anchor="middle" letter-spacing="2">MUTABLE · LA ORIENTACIÓN</text>

  <!-- Descriptions -->
  <text x="570" y="137" fill="white" font-size="13" fill-opacity="0.85">Se espera que evolucione</text>
  <text x="570" y="158" fill="white" font-size="13" fill-opacity="0.85">Refleja lo aprendido al ejecutar</text>

  <!-- Divider -->
  <line x1="570" y1="123" x2="805" y2="123" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
</svg>

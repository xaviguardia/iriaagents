<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="220" rx="16" fill="#f8fafc"/>

  <!-- Left panel: INMUTABLE -->
  <rect x="20" y="20" width="360" height="180" rx="12" fill="url(#leftGrad)" filter="url(#shadow)"/>

  <!-- Lock icon -->
  <rect x="155" y="52" width="50" height="38" rx="5" fill="white" opacity="0.95"/>
  <rect x="163" y="64" width="34" height="22" rx="3" fill="#4f46e5"/>
  <circle cx="180" cy="75" r="5" fill="white"/>
  <rect x="178" y="75" width="4" height="8" rx="2" fill="white"/>
  <path d="M165 52 Q165 38 180 38 Q195 38 195 52" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Left text -->
  <text x="200" y="72" fill="white" font-size="22" font-weight="700" opacity="0.95">Objetivo</text>
  <text x="200" y="96" fill="white" font-size="22" font-weight="700" opacity="0.95">+ Tests</text>
  <rect x="40" y="112" width="320" height="1" fill="white" opacity="0.2"/>
  <text x="200" y="140" fill="white" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3" opacity="0.85">INMUTABLE · EL CONTRATO</text>
  <text x="200" y="162" fill="white" font-size="12" text-anchor="middle" opacity="0.7">No se toca una vez acordado</text>
  <text x="200" y="180" fill="white" font-size="12" text-anchor="middle" opacity="0.7">Define qué significa "hecho"</text>

  <!-- Center divider with vs -->
  <circle cx="410" cy="110" r="22" fill="#1e293b"/>
  <text x="410" y="115" fill="white" font-size="13" font-weight="700" text-anchor="middle">vs</text>

  <!-- Right panel: MUTABLE -->
  <rect x="440" y="20" width="360" height="180" rx="12" fill="url(#rightGrad)" filter="url(#shadow)"/>

  <!-- Rotating arrows icon -->
  <path d="M570 88 A22 22 0 1 1 548 66" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <polygon points="548,55 548,70 563,70" fill="white"/>
  <path d="M590 88 A22 22 0 1 0 612 66" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <polygon points="612,55 612,70 597,70" fill="white"/>

  <!-- Right text -->
  <text x="630" y="72" fill="white" font-size="22" font-weight="700" opacity="0.95">Plan</text>
  <text x="630" y="96" fill="white" font-size="22" font-weight="700" opacity="0.95">+ Tareas</text>
  <rect x="460" y="112" width="320" height="1" fill="white" opacity="0.2"/>
  <text x="620" y="140" fill="white" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3" opacity="0.85">MUTABLE · LA ORIENTACIÓN</text>
  <text x="620" y="162" fill="white" font-size="12" text-anchor="middle" opacity="0.7">Se espera que evolucione</text>
  <text x="620" y="180" fill="white" font-size="12" text-anchor="middle" opacity="0.7">Refleja lo que has aprendido al ejecutar</text>
</svg>

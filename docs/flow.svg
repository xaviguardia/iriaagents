<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000018"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="860" height="340" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="430" y="32" fill="#1e293b" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">/new-task — cómo funciona</text>

  <!-- LEFT: Conversation panel -->
  <rect x="20" y="50" width="270" height="270" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="20" y="50" width="270" height="36" rx="12" fill="#6366f1"/>
  <rect x="20" y="74" width="270" height="12" fill="#6366f1"/>
  <text x="155" y="73" fill="white" font-size="12" font-weight="600" text-anchor="middle">7 preguntas</text>

  <!-- Chat bubbles -->
  <!-- P1 -->
  <rect x="35" y="100" width="160" height="24" rx="10" fill="#e0e7ff"/>
  <text x="45" y="116" fill="#4338ca" font-size="10" font-weight="600">P1 ¿Qué construir?</text>
  <!-- P2 -->
  <rect x="35" y="132" width="175" height="24" rx="10" fill="#e0e7ff"/>
  <text x="45" y="148" fill="#4338ca" font-size="10" font-weight="600">P2 ¿Estado actual?</text>
  <!-- P3 HIGHLIGHTED -->
  <rect x="32" y="162" width="240" height="32" rx="10" fill="#4f46e5"/>
  <text x="44" y="178" fill="white" font-size="10" font-weight="700">★ P3 ¿Cómo se verifica?</text>
  <text x="44" y="190" fill="#c7d2fe" font-size="9">← la más importante</text>
  <!-- P4 -->
  <rect x="35" y="202" width="170" height="24" rx="10" fill="#e0e7ff"/>
  <text x="45" y="218" fill="#4338ca" font-size="10" font-weight="600">P4 ¿En qué proyecto?</text>
  <!-- P5 -->
  <rect x="35" y="234" width="155" height="24" rx="10" fill="#e0e7ff"/>
  <text x="45" y="250" fill="#4338ca" font-size="10" font-weight="600">P5 ¿Entorno especial?</text>
  <!-- P6 -->
  <rect x="35" y="266" width="165" height="24" rx="10" fill="#e0e7ff"/>
  <text x="45" y="282" fill="#4338ca" font-size="10" font-weight="600">P6 ¿Reglas de código?</text>
  <!-- P7 -->
  <rect x="35" y="298" width="140" height="14" rx="7" fill="#e0e7ff"/>
  <text x="45" y="309" fill="#4338ca" font-size="9" font-weight="600">P7 ¿Qué runner?</text>

  <!-- Arrow center -->
  <line x1="300" y1="185" x2="370" y2="185" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="335" y="178" fill="#6366f1" font-size="10" text-anchor="middle" font-weight="600">genera</text>

  <!-- CENTER: File tree panel -->
  <rect x="380" y="50" width="220" height="270" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="380" y="50" width="220" height="36" rx="12" fill="#1e293b"/>
  <rect x="380" y="74" width="220" height="12" fill="#1e293b"/>
  <text x="490" y="73" fill="white" font-size="12" font-weight="600" text-anchor="middle">tasks/mi-tarea/</text>

  <!-- goal.md - special -->
  <rect x="393" y="100" width="194" height="28" rx="6" fill="#4f46e5"/>
  <text x="403" y="113" fill="white" font-size="11" font-weight="700">📄 goal.md</text>
  <text x="403" y="124" fill="#c7d2fe" font-size="9">NO TOCAR · el contrato</text>

  <!-- Other files: living -->
  <text x="403" y="148" fill="#64748b" font-size="10">📄 plan.md</text>
  <rect x="510" y="138" width="56" height="14" rx="7" fill="#fef3c7"/>
  <text x="538" y="149" fill="#92400e" font-size="8" text-anchor="middle" font-weight="600">vivo</text>

  <text x="403" y="168" fill="#64748b" font-size="10">📄 tasks.md</text>
  <rect x="510" y="158" width="56" height="14" rx="7" fill="#fef3c7"/>
  <text x="538" y="169" fill="#92400e" font-size="8" text-anchor="middle" font-weight="600">vivo</text>

  <text x="403" y="188" fill="#64748b" font-size="10">📄 coding-rules.md</text>
  <text x="403" y="208" fill="#64748b" font-size="10">📄 AGENT.md</text>
  <text x="403" y="228" fill="#64748b" font-size="10">📄 PROMPT.md</text>
  <text x="403" y="248" fill="#64748b" font-size="10">📄 task01-slug.md</text>
  <text x="403" y="268" fill="#64748b" font-size="10">📁 evidence/</text>
  <text x="403" y="288" fill="#64748b" font-size="10">📁 scripts/</text>
  <text x="403" y="308" fill="#10b981" font-size="10" font-weight="600">▶ run-claude.sh</text>

  <!-- Arrow right -->
  <line x1="610" y1="185" x2="680" y2="185" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>
  <text x="645" y="178" fill="#10b981" font-size="10" text-anchor="middle" font-weight="600">ejecuta</text>

  <!-- RIGHT: Result panel -->
  <rect x="690" y="50" width="150" height="270" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="690" y="50" width="150" height="36" rx="12" fill="#065f46"/>
  <rect x="690" y="74" width="150" height="12" fill="#065f46"/>
  <text x="765" y="73" fill="white" font-size="12" font-weight="600" text-anchor="middle">resultado</text>

  <!-- Terminal-style output -->
  <rect x="700" y="100" width="130" height="200" rx="6" fill="#0f172a"/>
  <text x="710" y="120" fill="#10b981" font-size="9" font-weight="600">$ run-suite.sh</text>
  <text x="710" y="138" fill="#64748b" font-size="8">running specs...</text>
  <text x="710" y="154" fill="#10b981" font-size="8">PASS lc_001</text>
  <text x="710" y="168" fill="#10b981" font-size="8">PASS lc_002</text>
  <text x="710" y="182" fill="#10b981" font-size="8">PASS lc_003</text>
  <text x="710" y="196" fill="#64748b" font-size="8">...</text>
  <text x="710" y="215" fill="#f8fafc" font-size="9" font-weight="700">PASS: 53</text>
  <text x="710" y="229" fill="#ef4444" font-size="9" font-weight="700">FAIL: 0</text>
  <rect x="700" y="243" width="130" height="2" fill="#1e293b"/>
  <text x="765" y="262" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">✓ DONE</text>
  <text x="765" y="278" fill="#64748b" font-size="8" text-anchor="middle">objetivo conseguido</text>
  <text x="765" y="292" fill="#64748b" font-size="8" text-anchor="middle">tal como se definió</text>
</svg>

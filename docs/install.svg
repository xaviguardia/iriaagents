<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 110" width="840" height="110"
     font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="840" height="110" rx="14" fill="#f1f5f9"/>

  <!-- STEP 1 -->
  <rect x="18" y="15" width="210" height="80" rx="10" fill="white"/>
  <circle cx="46" cy="38" r="13" fill="#6366f1"/>
  <text x="46" y="43" fill="white" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="68" y="36" fill="#1e293b" font-size="12" font-weight="700">Clona</text>
  <text x="68" y="50" fill="#64748b" font-size="10">github.com/xaviguardia</text>
  <rect x="24" y="58" width="198" height="30" rx="6" fill="#0f172a"/>
  <text x="34" y="73" fill="#10b981" font-size="9" font-weight="600">$ git clone</text>
  <text x="34" y="84" fill="#94a3b8" font-size="8">  .../iriaagents</text>

  <line x1="234" y1="55" x2="264" y2="55" stroke="#6366f1" stroke-width="2" marker-end="url(#a)"/>

  <!-- STEP 2 -->
  <rect x="270" y="15" width="210" height="80" rx="10" fill="white"/>
  <circle cx="298" cy="38" r="13" fill="#6366f1"/>
  <text x="298" y="43" fill="white" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="320" y="36" fill="#1e293b" font-size="12" font-weight="700">Instala</text>
  <text x="320" y="50" fill="#64748b" font-size="10">symlinks + iriaagents_path</text>
  <rect x="276" y="58" width="198" height="30" rx="6" fill="#0f172a"/>
  <text x="286" y="71" fill="#10b981" font-size="9" font-weight="600">$ cd iriaagents</text>
  <text x="286" y="83" fill="#10b981" font-size="9" font-weight="600">$ ./install.sh</text>

  <line x1="486" y1="55" x2="516" y2="55" stroke="#6366f1" stroke-width="2" marker-end="url(#a)"/>

  <!-- STEP 3 -->
  <rect x="522" y="15" width="210" height="80" rx="10" fill="white"/>
  <circle cx="550" cy="38" r="13" fill="#6366f1"/>
  <text x="550" y="43" fill="white" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="572" y="36" fill="#1e293b" font-size="12" font-weight="700">Disponible</text>
  <text x="572" y="50" fill="#64748b" font-size="10">en el chat del agente</text>
  <rect x="528" y="58" width="198" height="30" rx="6" fill="#0f172a"/>
  <text x="538" y="77" fill="#a78bfa" font-size="12" font-weight="700">/new-task</text>

  <line x1="738" y1="55" x2="768" y2="55" stroke="#10b981" stroke-width="2" marker-end="url(#b)"/>

  <!-- DONE -->
  <rect x="776" y="28" width="52" height="54" rx="10" fill="#065f46"/>
  <text x="802" y="54" fill="#10b981" font-size="20" text-anchor="middle">✓</text>
  <text x="802" y="72" fill="#a7f3d0" font-size="9" text-anchor="middle" font-weight="600">listo</text>
</svg>
